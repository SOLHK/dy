name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check Xcode and SDKs
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Check offline regressions
        run: |
          python3 scripts/test_publication_region.py
          python3 scripts/test_classic_channel_navigation.py
          python3 scripts/test_session_guard.py
          python3 scripts/test_saver_default.py
          python3 scripts/test_settings_layout.py
          python3 scripts/test_menu_policy.py
          python3 scripts/test_rail_alignment.py
          python3 scripts/test_storage_scan.py
          python3 scripts/test_offline_retention.py
          swiftc -swift-version 5 -parse-as-library \
            DouDuo/DDDiagnosticLog.swift scripts/fixtures/diagnostic-log-tests.swift \
            -o "$RUNNER_TEMP/dy-diagnostic-tests"
          "$RUNNER_TEMP/dy-diagnostic-tests"

      - name: Fetch pinned VLCKit binary
        run: sh scripts/fetch-vlckit.sh

      - name: Run offline unit tests
        run: |
          xcodebuild test \
            -project DouDuo.xcodeproj \
            -scheme DouDuoVideoFitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.2' \
            -derivedDataPath "$RUNNER_TEMP/dy-build" \
            -parallel-testing-enabled NO \
            -only-testing:DouDuoVideoFitTests/DYVideoFitTests \
            -only-testing:DouDuoVideoFitTests/DYFeedOrientationTests \
            -only-testing:DouDuoVideoFitTests/DYAutoPiPTests \
            -only-testing:DouDuoVideoFitTests/DYShareLinkTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile iPhone and iPad app
        run: |
          xcodebuild build \
            -project DouDuo.xcodeproj \
            -scheme DouDuo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dy-build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          python3 scripts/package_unsigned.py \
            "$RUNNER_TEMP/dy-build/Build/Products/Release-iphoneos/DouDuo.app" \
            "$RUNNER_TEMP/dy-ipa"

      - name: Verify packaged app metadata
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          from zipfile import ZipFile

          [ipa] = (Path(os.environ['RUNNER_TEMP']) / 'dy-ipa').glob('*.ipa')
          with ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read('Payload/DouDuo.app/Info.plist'))
          expected = {'CFBundleDisplayName': '抖音', 'CFBundleIdentifier': 'com.solhk.dy'}
          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit(f'{key}: expected {value!r}, got {info.get(key)!r}')
              print(f'{key} = {value}')
          PY

      - name: Upload unsigned IPA and SHA-256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DY-unsigned
          path: ${{ runner.temp }}/dy-ipa
          if-no-files-found: error
          compression-level: 0

      - name: Check compact chat layout in Simulator
        run: |
          xcodebuild test -quiet \
            -project DouDuo.xcodeproj \
            -scheme DouDuo \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.2' \
            -derivedDataPath "$RUNNER_TEMP/dy-build" \
            -parallel-testing-enabled NO \
            -only-testing:DouDuoUITests/DouDuoUITests/testSimpleMessagesCoverUsesFullWidthChat \
            CODE_SIGNING_ALLOWED=NO
